openapi: 3.1.0
info:
  title: Saveria API — Autenticación, onboarding, cuentas y movimientos
  version: 0.2.0
  description: |
    Contrato vigente desde la feature 002-accounts-transactions. Incluye todo el contrato de la
    001 (sin cambios) más cuentas y movimientos. Es la fuente de la verdad: el backend se valida
    contra este archivo con pruebas de contrato y la app genera sus tipos desde aquí. El archivo
    de la 001 queda como registro histórico.

    Reglas transversales:
    - Todas las rutas `/v1/*` responden JSON. Los errores usan el esquema `Error`.
    - Autenticación con `Authorization: Bearer <accessToken>`. En cada request el servidor
      verifica la firma del JWT y que la sesión (`sid`) siga activa.
    - Los mensajes de error de autenticación son genéricos y no revelan si un correo existe.
    - Tamaño máximo del body: 16 KB.
    - Ningún endpoint rechaza a un usuario por no haber verificado su correo: el bloqueo de los
      7 días (FR-032) es solo de pantalla y la sincronización sigue funcionando.
    - Cuentas y movimientos (002): el teléfono los crea con su propio UUID y los envía con `PUT`
      del registro completo, con su `updatedAt`. Se aplica last-write-wins: si el servidor tiene
      una versión igual o más nueva responde 409 con ella. Repetir un envío no duplica nada. Los
      montos viajan como texto decimal, nunca como número.
servers:
  - url: http://localhost:8000
    description: Desarrollo local

tags:
  - name: auth
  - name: me
  - name: legal
  - name: accounts
    description: Cuentas de dinero del usuario (002)
  - name: transactions
    description: Gastos, ingresos, transferencias y ajustes (002)
  - name: links
    description: Páginas HTML mínimas abiertas desde los correos (FR-037). No son JSON.

paths:
  /health:
    get:
      summary: Estado del servicio
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, const: ok }

  /v1/auth/register:
    post:
      tags: [auth]
      summary: Crear cuenta e iniciar sesión (FR-001 a FR-004, FR-031)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterRequest" }
      responses:
        "201":
          description: Cuenta creada, sesión iniciada y correo de verificación en envío
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "409":
          description: No se pudo crear la cuenta con ese correo (mensaje genérico)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: Versión de política desconocida o no aceptada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyAttempts" }

  /v1/auth/login:
    post:
      tags: [auth]
      summary: Iniciar sesión (FR-006, FR-007)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Sesión iniciada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/InvalidCredentials" }
        "429": { $ref: "#/components/responses/TooManyAttempts" }

  /v1/auth/refresh:
    post:
      tags: [auth]
      summary: Renovar tokens (rotación del refresh token, FR-008)
      description: |
        Cada refresh token sirve una sola vez. Si llega el token anterior dentro de los 60 s
        siguientes a la rotación (respuesta perdida en la red), se emite un par nuevo; después
        de esa ventana se considera reutilización y la sesión se revoca.
        El cliente MUST hacer un solo refresh a la vez.
        Si la cuenta fue borrada responde 401 con `code: account_deleted`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string, minLength: 20, maxLength: 200 }
      responses:
        "200":
          description: Tokens nuevos
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenPair" }
        "401":
          description: Sesión vencida, revocada o refresh token inválido
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/auth/logout:
    post:
      tags: [auth]
      summary: Cerrar sesión (FR-009)
      description: |
        Revoca la sesión del access token enviado o, si no hay access token, la sesión a la que
        pertenece `refreshToken` (actual o anterior). Esto permite revocar después un logout
        hecho sin conexión. Responde 204 siempre, aunque el token ya no sirva, para no revelar
        nada.
      security: [{ bearerAuth: [] }, {}]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken: { type: string, minLength: 20, maxLength: 200 }
      responses:
        "204": { description: Sesión revocada, o no había nada que revocar }

  /v1/auth/password/forgot:
    post:
      tags: [auth]
      summary: Pedir enlace de recuperación (FR-028, FR-030, FR-035)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { $ref: "#/components/schemas/Email" }
      responses:
        "202": { $ref: "#/components/responses/NeutralAccepted" }
        "400": { $ref: "#/components/responses/ValidationError" }

  /v1/auth/password/change:
    post:
      tags: [auth]
      summary: Cambiar contraseña conociendo la actual (FR-018a)
      description: Cierra todas las demás sesiones; la actual sigue activa.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string, minLength: 1, maxLength: 1024 }
                newPassword: { $ref: "#/components/schemas/NewPassword" }
      responses:
        "204": { description: Contraseña cambiada }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/InvalidCredentials" }
        "429": { $ref: "#/components/responses/TooManyAttempts" }

  /v1/auth/email/verification:
    post:
      tags: [auth]
      summary: Reenviar el correo de verificación (FR-033, FR-034, FR-035)
      description: Invalida el enlace anterior. Si el correo ya está verificado, responde igual.
      security: [{ bearerAuth: [] }]
      responses:
        "202": { $ref: "#/components/responses/NeutralAccepted" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/auth/email:
    put:
      tags: [auth]
      summary: Corregir el correo mientras no esté verificado (FR-034)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { $ref: "#/components/schemas/Email" }
      responses:
        "202":
          description: Correo actualizado y enlace nuevo enviado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409":
          description: El correo ya está verificado o no se puede usar el correo nuevo (genérico)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyAttempts" }

  /v1/me:
    get:
      tags: [me]
      summary: Usuario actual, perfil, cuenta por defecto y estado de verificación
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    delete:
      tags: [me]
      summary: Borrar la cuenta y todos sus datos (FR-023 a FR-025)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string, minLength: 1, maxLength: 1024 }
      responses:
        "204": { description: Cuenta y datos eliminados; todas las sesiones revocadas }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/InvalidCredentials" }
        "429": { $ref: "#/components/responses/TooManyAttempts" }

  /v1/me/profile:
    put:
      tags: [me]
      summary: Guardar perfil y preferencias (onboarding y Configuración, FR-011 a FR-022)
      description: |
        Last-write-wins por registro completo. Se aplica si `updatedAt` es posterior al del
        servidor; si no, responde 409 con la versión del servidor.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProfileUpdate" }
      responses:
        "200":
          description: Perfil guardado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profile" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409":
          description: El servidor tiene una versión más nueva
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profile" }

  /v1/me/onboarding/complete:
    post:
      tags: [me]
      summary: Terminar el onboarding y crear la cuenta "Efectivo" (FR-016)
      description: |
        Idempotente por `defaultAccountId`. Requiere `primaryCurrency` en el perfil. Si el último
        paso se hace sin conexión, la app crea la cuenta localmente y esta llamada va al outbox.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [defaultAccountId]
              properties:
                defaultAccountId: { type: string, format: uuid }
      responses:
        "200":
          description: Onboarding terminado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "400":
          description: defaultAccountId no es un UUID o ya lo usa otra cuenta
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422":
          description: Falta la moneda principal
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/accounts/{id}:
    put:
      tags: [accounts]
      summary: Crear o reemplazar una cuenta (FR-015 a FR-023)
      description: |
        Idempotente por `id`. Last-write-wins por `updatedAt`. Si `isDefault` es true, las demás
        cuentas del usuario dejan de ser la cuenta por defecto en la misma operación. Reglas:
        nombre único entre las activas (sin distinguir mayúsculas), máximo 20 activas, la cuenta
        por defecto no se archiva, siempre queda una cuenta por defecto, y la moneda solo cambia
        si la cuenta no tiene movimientos.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/EntityId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccountInput" }
      responses:
        "200":
          description: Cuenta guardada (o el mismo envío repetido)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountRecord" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: El id pertenece a una cuenta de otro usuario (no se revela cuál)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: El servidor tiene una versión igual o más nueva
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountRecord" }
        "422":
          description: El usuario no tiene moneda principal (FR-008)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/transactions/{id}:
    put:
      tags: [transactions]
      summary: Crear o reemplazar un movimiento (FR-001 a FR-009, FR-024 a FR-033)
      description: |
        Un solo caso de uso para los cuatro tipos; la IA de la feature 004 usará el mismo.
        Idempotente por `id`, last-write-wins por `updatedAt`. Con `deletedAt: null` también
        restaura un movimiento borrado ("Deshacer", FR-026). Las cuentas deben ser del usuario y
        cada moneda debe coincidir con la de su cuenta.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/EntityId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TransactionInput" }
      responses:
        "200":
          description: Movimiento guardado (o el mismo envío repetido)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TransactionRecord" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: El id pertenece a un movimiento de otro usuario (no se revela cuál)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: El servidor tiene una versión igual o más nueva
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TransactionRecord" }
        "422":
          description: El usuario no tiene moneda principal (FR-008)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      tags: [transactions]
      summary: Borrar un movimiento (borrado lógico, FR-026)
      description: |
        Marca `deletedAt`. Idempotente y last-write-wins por `updatedAt`. Si el servidor no
        conoce el id (se creó y se borró sin conexión), responde 204 sin crear nada.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/EntityId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [updatedAt]
              properties:
                updatedAt: { type: string, format: date-time }
      responses:
        "204": { description: Borrado (o ya estaba borrado o no existía) }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: El id pertenece a un movimiento de otro usuario
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: El servidor tiene una versión más nueva
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TransactionRecord" }

  /v1/legal/privacy-policy:
    get:
      tags: [legal]
      summary: Versión vigente de la política de tratamiento de datos (FR-004, FR-005)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [version, url]
                properties:
                  version: { type: string, example: 2026-10-v1 }
                  url: { type: string, format: uri }

  /legal/privacy:
    get:
      tags: [links]
      summary: Página HTML con el texto de la política
      responses:
        "200":
          description: HTML
          content:
            text/html: { schema: { type: string } }

  /links/verify-email:
    get:
      tags: [links]
      summary: Muestra el botón "Confirmar mi correo" (no consume el token)
      parameters:
        - $ref: "#/components/parameters/LinkToken"
      responses:
        "200":
          description: Página con el botón, o con el aviso de enlace inválido y cómo pedir otro
          content:
            text/html: { schema: { type: string } }
    post:
      tags: [links]
      summary: Consume el token y marca el correo como verificado
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string, maxLength: 100 }
      responses:
        "200":
          description: Página de éxito ("ya puedes volver a la app") o de enlace inválido
          content:
            text/html: { schema: { type: string } }

  /links/reset-password:
    get:
      tags: [links]
      summary: Muestra el formulario de contraseña nueva (no consume el token)
      parameters:
        - $ref: "#/components/parameters/LinkToken"
      responses:
        "200":
          description: Formulario, o aviso de enlace vencido o usado con la opción de pedir otro
          content:
            text/html: { schema: { type: string } }
    post:
      tags: [links]
      summary: Consume el token, cambia la contraseña y revoca todas las sesiones (FR-029)
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [token, password, passwordConfirmation]
              properties:
                token: { type: string, maxLength: 100 }
                password: { type: string }
                passwordConfirmation: { type: string }
      responses:
        "200":
          description: Página de éxito, o el formulario con errores de validación
          content:
            text/html: { schema: { type: string } }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    EntityId:
      name: id
      in: path
      required: true
      description: UUID generado por el teléfono
      schema: { type: string, format: uuid }
    LinkToken:
      name: token
      in: query
      required: true
      schema: { type: string, maxLength: 100 }

  responses:
    ValidationError:
      description: Datos inválidos
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    InvalidCredentials:
      description: Credenciales incorrectas (mensaje genérico)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: |
        Falta el token, es inválido o la sesión fue revocada. Con `code: account_deleted` la
        cuenta ya no existe y el cliente MUST borrar los datos locales de ese usuario.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TooManyAttempts:
      description: Demasiados intentos; vuelve a intentar más tarde (mensaje genérico)
      headers:
        Retry-After:
          schema: { type: integer, description: Segundos }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NeutralAccepted:
      description: Respuesta idéntica exista o no el correo, y aunque se haya superado el límite
      content:
        application/json:
          schema:
            type: object
            required: [message]
            properties:
              message: { type: string }

  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum:
            - validation_error
            - invalid_credentials
            - unauthorized
            - too_many_attempts
            - email_unavailable
            - policy_not_accepted
            - email_already_verified
            - primary_currency_required
            - account_deleted
            - not_found
            - internal_error
        message: { type: string }
        fields:
          type: object
          description: Errores por campo (solo en validation_error)
          additionalProperties: { type: string }

    Email:
      type: string
      maxLength: 254
      description: |
        Se aceptan espacios alrededor y mayúsculas: el servidor aplica trim y minúsculas antes de
        validar el formato y de usarlo.

    NewPassword:
      type: string
      minLength: 8
      maxLength: 1024
      description: Al menos una letra y un número (FR-003).

    Device:
      type: object
      required: [id]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 80 }

    RegisterRequest:
      type: object
      required: [email, password, policyVersion, policyAccepted, device]
      properties:
        email: { $ref: "#/components/schemas/Email" }
        password: { $ref: "#/components/schemas/NewPassword" }
        policyVersion: { type: string }
        policyAccepted: { type: boolean, const: true }
        device: { $ref: "#/components/schemas/Device" }

    LoginRequest:
      type: object
      required: [email, password, device]
      properties:
        email: { $ref: "#/components/schemas/Email" }
        password: { type: string, minLength: 1, maxLength: 1024 }
        device: { $ref: "#/components/schemas/Device" }

    TokenPair:
      type: object
      required: [accessToken, accessTokenExpiresAt, refreshToken]
      properties:
        accessToken: { type: string }
        accessTokenExpiresAt: { type: string, format: date-time }
        refreshToken: { type: string }

    AuthResponse:
      type: object
      required: [tokens, me]
      properties:
        tokens: { $ref: "#/components/schemas/TokenPair" }
        me: { $ref: "#/components/schemas/Me" }

    CurrencyCode:
      type: string
      pattern: "^[A-Z]{3}$"
      description: ISO 4217 del catálogo soportado

    OnboardingStep:
      type: string
      enum: [ai_name, country, city, currency, ai_mode, done]

    Profile:
      type: object
      required:
        - aiName
        - countryCode
        - city
        - primaryCurrency
        - referenceCurrencies
        - aiMode
        - onboardingStep
        - updatedAt
      properties:
        aiName: { type: [string, "null"], maxLength: 30 }
        countryCode: { type: [string, "null"], pattern: "^[A-Z]{2}$" }
        city: { type: [string, "null"], maxLength: 80 }
        primaryCurrency:
          oneOf:
            - $ref: "#/components/schemas/CurrencyCode"
            - type: "null"
        referenceCurrencies:
          type: array
          maxItems: 2
          uniqueItems: true
          items: { $ref: "#/components/schemas/CurrencyCode" }
        aiMode: { type: string, enum: [manual, auto] }
        onboardingStep: { $ref: "#/components/schemas/OnboardingStep" }
        updatedAt: { type: string, format: date-time }

    ProfileUpdate:
      allOf:
        - $ref: "#/components/schemas/Profile"
        - type: object
          properties:
            autoModeConfirmed:
              type: boolean
              description: Obligatorio en true cuando aiMode pasa de manual a auto (FR-019)

    Account:
      type: object
      required: [id, name, currency, initialBalance, isDefault]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        currency: { $ref: "#/components/schemas/CurrencyCode" }
        initialBalance:
          type: string
          pattern: "^-?\\d+(\\.\\d{1,4})?$"
          description: Decimal exacto como texto, nunca número de punto flotante
        isDefault: { type: boolean }

    Amount:
      type: string
      pattern: "^\\d{1,12}(\\.\\d{1,4})?$"
      description: |
        Decimal exacto, positivo, como texto. Máximo 12 dígitos enteros; los decimales permitidos
        dependen de la moneda (COP 0, USD 2). Nunca número de punto flotante.

    SignedAmount:
      type: string
      pattern: "^-?\\d{1,12}(\\.\\d{1,4})?$"
      description: Como Amount pero con signo (saldo inicial, ajuste)

    LocalDate:
      type: string
      format: date
      description: Día local del movimiento según el teléfono (YYYY-MM-DD)

    AccountType:
      type: string
      enum: [cash, wallet, bank]
      description: Efectivo, billetera digital (Nequi, Daviplata…) o banco

    AccountInput:
      type: object
      required: [name, type, currency, initialBalance, isDefault, archivedAt, updatedAt]
      properties:
        name: { type: string, minLength: 1, maxLength: 40 }
        type: { $ref: "#/components/schemas/AccountType" }
        currency: { $ref: "#/components/schemas/CurrencyCode" }
        initialBalance: { $ref: "#/components/schemas/SignedAmount" }
        isDefault: { type: boolean }
        archivedAt: { type: [string, "null"], format: date-time }
        updatedAt: { type: string, format: date-time }

    AccountRecord:
      allOf:
        - $ref: "#/components/schemas/AccountInput"
        - type: object
          required: [id, createdAt]
          properties:
            id: { type: string, format: uuid }
            createdAt: { type: string, format: date-time }

    TransactionType:
      type: string
      enum: [expense, income, transfer, adjustment]

    CategorySlug:
      type: string
      enum:
        - groceries
        - dining
        - transport
        - vehicle
        - housing
        - utilities
        - health
        - personal_care
        - education
        - subscriptions
        - entertainment
        - shopping
        - home_family
        - pets
        - gifts
        - travel
        - fees_taxes
        - other_expense
        - salary
        - bonus
        - freelance
        - business
        - investments
        - gifts_received
        - refunds
        - other_income
      description: Catálogo fijo (packages/shared/src/catalog/categories.ts)

    TransactionInput:
      type: object
      description: |
        Reglas por tipo:
        - expense / income: `amount` > 0 y `categorySlug` del tipo correcto; sin campos `to*`.
        - transfer: `amount` > 0, `toAccountId` distinta de `accountId`, `toAmount` > 0 y
          `toCurrency`; sin categoría. Si las monedas son iguales, `toAmount` = `amount`.
        - adjustment: `amount` con signo y distinto de cero; sin categoría ni campos `to*`.
        `occurredOn` no puede ser futura (FR-007). `currency` y `toCurrency` deben coincidir con
        la moneda de su cuenta.
      required: [type, accountId, amount, currency, toAccountId, toAmount, toCurrency, categorySlug, description, occurredOn, deletedAt, updatedAt]
      properties:
        type: { $ref: "#/components/schemas/TransactionType" }
        accountId: { type: string, format: uuid }
        amount: { $ref: "#/components/schemas/SignedAmount" }
        currency: { $ref: "#/components/schemas/CurrencyCode" }
        toAccountId: { type: [string, "null"], format: uuid }
        toAmount:
          oneOf:
            - $ref: "#/components/schemas/Amount"
            - type: "null"
        toCurrency:
          oneOf:
            - $ref: "#/components/schemas/CurrencyCode"
            - type: "null"
        categorySlug:
          oneOf:
            - $ref: "#/components/schemas/CategorySlug"
            - type: "null"
        description: { type: [string, "null"], maxLength: 120 }
        occurredOn: { $ref: "#/components/schemas/LocalDate" }
        deletedAt: { type: [string, "null"], format: date-time }
        updatedAt: { type: string, format: date-time }

    TransactionRecord:
      allOf:
        - $ref: "#/components/schemas/TransactionInput"
        - type: object
          required: [id, createdAt]
          properties:
            id: { type: string, format: uuid }
            createdAt: { type: string, format: date-time }

    Me:
      type: object
      required: [id, email, emailVerified, verificationDeadline, verificationRequired, profile, defaultAccount]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        emailVerified: { type: boolean }
        verificationDeadline:
          type: string
          format: date-time
          description: created_at + 7 días
        verificationRequired:
          type: boolean
          description: true si no está verificado y ya pasó el plazo; la app muestra el bloqueo (FR-032)
        profile: { $ref: "#/components/schemas/Profile" }
        defaultAccount:
          oneOf:
            - $ref: "#/components/schemas/Account"
            - type: "null"
